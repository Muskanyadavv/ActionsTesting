name: Docker Build, Test, and Push to Docker Hub

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull code from the repository
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx for enhanced build features
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Log in to Docker Hub using stored GitHub Secrets
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request' # Skip push on PRs to prevent unauthorized registry pushes
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Build the local Docker image for testing
    - name: Build Docker Image for Testing
      run: |
        docker build -t my-python-app:${{ github.sha }} .

    # 5. Run tests inside the built container
    - name: Run Pytest inside Container
      run: |
        docker run --rm my-python-app:${{ github.sha }}

    # 6. Push image to Docker Hub (ONLY executes if step 5 passes)
    - name: Build and Push Docker Image to Registry
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:${{ github.sha }}