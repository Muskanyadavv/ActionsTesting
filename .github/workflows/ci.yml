name: Docker Build, Test, and Push to Docker Hub

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/my-python-app

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Validate image name
      run: |
        echo "IMAGE=[$IMAGE]"
        echo "$IMAGE" | grep -Eq '^[a-z0-9._-]+/[a-z0-9._-]+$' \
          || { echo "::error::Bad image name - check vars.DOCKERHUB_USERNAME"; exit 1; }

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build once, load into local docker for testing
    - name: Build image (test stage)
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        push: false
        tags: my-python-app:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Pytest inside Container
      run: docker run --rm my-python-app:test

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Reuses cache from step above - near-instant, no rebuild
    - name: Push image to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
        cache-from: type=gha